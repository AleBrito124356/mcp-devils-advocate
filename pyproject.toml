[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-devils-advocate"
version = "0.1.0"
description = "MCP server that stress-tests reasoning — devil's advocate, premortem analysis, assumption audits and steelmanning as enforced, structured protocols."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alejandro Brito", email = "alejandrobritoolivera@gmail.com"}]
keywords = ["mcp", "model-context-protocol", "claude", "ai-agents", "critical-thinking", "reasoning", "premortem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/AleBrito124356/mcp-devils-advocate"
Source = "https://github.com/AleBrito124356/mcp-devils-advocate"
Issues = "https://github.com/AleBrito124356/mcp-devils-advocate/issues"

[project.scripts]
mcp-devils-advocate = "mcp_devils_advocate.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_devils_advocate"]
